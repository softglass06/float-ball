name: build-macos

# 手动触发（Actions 页点 "Run workflow"），或推送 v* 标签自动触发。
# PyInstaller 不能跨平台交叉编译，Mac 版必须在 macOS 上打包，这里用免费 macOS runner。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Apple Silicon (arm64)。Mac 自 2020 年起基本全是 M 芯片。
    # 若要兼容老款 Intel Mac，可改用 x86_64 环境（如可用时把 runs-on 换成 macos-13）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 .app（无控制台）
        run: |
          pyinstaller --noconfirm --windowed --name FloatBall floatball.py

      - name: 打包 zip 和 dmg
        run: |
          cd dist
          ditto -c -k --keepParent FloatBall.app FloatBall-mac.zip
          hdiutil create -volname FloatBall -srcfolder FloatBall.app -ov -format UDZO FloatBall.dmg
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: FloatBall-macos
          path: |
            dist/FloatBall-mac.zip
            dist/FloatBall.dmg
